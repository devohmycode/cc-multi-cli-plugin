name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
        env:
          NODE_OPTIONS: --import=./test/watchdog.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-reports-${{ matrix.os }}
          path: report.*.json
          if-no-files-found: ignore
